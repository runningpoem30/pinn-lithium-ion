seeds: [1234, 2345, 3456]

base_experiment:
  data:
    dataset_path: SeversonBattery.mat
    batch_size: 2048
    num_workers: 0
  model:
    surrogate_hidden_dims: [64, 64]
    dynamics_hidden_dims: [32, 32]
  training:
    seed: 1234
    epochs: 60
    learning_rate: 0.001
    weight_decay: 0.0
    # Selected by validation battery-macro RUL RMSE in Step 16 tuning.
    physics_weight: 1.0
    gradient_clip_norm: 5.0
    early_stopping_patience: 10
    early_stopping_min_delta: 0.1
    early_stopping_monitor: data
    device: cpu
    max_train_batches: null
    max_validation_batches: null

tuning_report: artifacts/deephpm/rul/physics_weight_tuning/tuning_report.json
test_reference: artifacts/rul/task_definition/rul_test_reference.csv
output_dir: artifacts/deephpm/rul/final
