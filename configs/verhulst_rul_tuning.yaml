physics_weights: [0.001, 0.01, 0.1, 1.0]

base_experiment:
  data:
    dataset_path: SeversonBattery.mat
    batch_size: 2048
    num_workers: 0
  model:
    surrogate_hidden_dims: [64, 64]
    dynamics_hidden_dims: [32, 32]
  training:
    seed: 1234
    epochs: 30
    learning_rate: 0.001
    weight_decay: 0.0
    physics_weight: 0.001
    gradient_clip_norm: 5.0
    early_stopping_patience: 7
    early_stopping_min_delta: 0.1
    early_stopping_monitor: data
    device: cpu
    max_train_batches: null
    max_validation_batches: null

verhulst_parameters:
  initial_rate: 0.005
  initial_capacity: 0.5
  initial_offset: 0.01
  capacity_bounds: [0.200001, 1.0]
  offset_bounds: [0.0, 0.1]
  rate_epsilon: 1.0e-8

crossing:
  eol_pcl_threshold: 0.2
  non_crossing_horizon_cycles: 5000.0
  epsilon: 1.0e-6
  pcl_data_weight: 1.0
  non_crossing_penalty_weight: 1.0
  non_crossing_margin: 0.0001

output_dir: artifacts/verhulst/rul/physics_weight_tuning
