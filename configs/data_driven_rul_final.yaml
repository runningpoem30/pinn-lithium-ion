seeds: [1234, 2345, 3456]

base_experiment:
  data:
    dataset_path: SeversonBattery.mat
    batch_size: 2048
    num_workers: 0

  model:
    surrogate_hidden_dims: [64, 64]
    dynamics_hidden_dims: [32, 32]

  training:
    seed: 1234
    epochs: 60
    learning_rate: 0.001
    weight_decay: 0.0
    physics_weight: 0.0
    gradient_clip_norm: 5.0
    early_stopping_patience: 10
    # The RUL checkpoint monitor is in physical cycles.
    early_stopping_min_delta: 0.1
    early_stopping_monitor: data
    device: cpu
    max_train_batches: null
    max_validation_batches: null

output_dir: artifacts/data_driven/rul/final
